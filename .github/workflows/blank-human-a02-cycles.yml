name: HUMAN-A02 mouth/neutral pose diagnostic and Cycles render
on:
  push:
    branches: [experiment/human-a02-mouth-neutralization]
    paths: ['.github/workflows/blank-human-a02-cycles.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-mouth-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact Blender Python/Cycles toolchain
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3 Pillow==11.3.0
      - name: Restore licensed original Einar reference
        run: |
          mkdir -p .ci-einar artifacts/human-a02
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 540 --silent --show-error \
            'https://studio.blender.org/download-source/files/41/419e83fb75f30b989adf7920dec7a21c/419e83fb75f30b989adf7920dec7a21c.zip' \
            -o .ci-einar/einar-official.zip
          python3 experiments/hero-v4/restore_textures.py
          python3 -m py_compile experiments/human-a02/generate_and_render.py experiments/human-a02/contact_sheet.py
      - name: Measure lip/rig and render neutral-mouth corrective on real Blender
        env:
          OMP_NUM_THREADS: '4'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout -k 15s 900s python3 -u experiments/human-a02/generate_and_render.py
          python3 experiments/human-a02/contact_sheet.py
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/human-a02')
          x=json.loads((p/'report.json').read_text())
          assert len(x['renders'])==4,x.get('error')
          assert x['status'].startswith('A02_MOUTH_CORRECTIVE_AND_FOUR_CYCLES_RENDERS_COMPLETED')
          assert x['human_visual_approval']=='BLOCKED'
          assert (p/'human-a02-neutral-mouth.blend').stat().st_size>100000
          assert 'neutral_mouth_audit' in x
          print('MOUTH_A02_CYCLES_EVIDENCE_PASS')
          PY
      - name: Archive actual images, edited .blend and diagnostic, not original ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-a02-neutral-mouth-cycles
          path: artifacts/human-a02/
          retention-days: 7
          if-no-files-found: warn
