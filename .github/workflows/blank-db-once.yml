name: Blank Engine — one-time read-only DB diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-db-once.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Read-only database check
        env:
          BLANK_PG_URL: ${{ secrets.BLANK_PG_URL }}
        run: node scripts/db-admin.mjs check
