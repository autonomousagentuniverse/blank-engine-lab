name: Blank Engine — manual database check
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only check or explicit migration 0001_core'
        required: true
        default: check
        type: choice
        options:
          - check
          - migrate

permissions:
  contents: read
concurrency:
  group: blank-engine-db-maintenance
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run engine tests
        run: npm test
      - name: Check or migrate PostgreSQL manually
        env:
          BLANK_PG_URL: ${{ secrets.BLANK_PG_URL }}
          BLANK_DB_OPERATION: ${{ inputs.operation }}
        run: node scripts/db-admin.mjs "$BLANK_DB_OPERATION"
