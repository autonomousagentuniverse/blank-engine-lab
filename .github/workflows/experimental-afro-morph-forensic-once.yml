name: EXPERIMENTAL Source Masked Morph Delta Forensic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-morph-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download immutable UV baked original Blender with shape keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source artifacts/afro-visible-morph-forensic
          gh run download 39142378127 --repo autonomousagentuniverse/blank-engine-lab --name afro-uv-baked-pbr-blender-20261018 --dir source
          printf 'f903f4412bab7d29bdad85c31d21e576b1a6b3fbcbca8daf13c9e17dc5715fdb  source/afro_skinbound_uv_pbr.blend\n' | sha256sum -c -
      - name: Identify precise source shape-key delta inside original two MASK groups
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3
          python3 -m py_compile character-pipeline/references/audit_visible_morph_deltas.py
          timeout -k 10s 500s python3 -u character-pipeline/references/audit_visible_morph_deltas.py
      - name: Preserve all eleven real source morph measurements
        run: |
          python3 - <<'PY'
          import pathlib,json
          d=json.loads(pathlib.Path('artifacts/afro-visible-morph-forensic/source-masked-morph-deltas.json').read_text())
          assert d['source_unmodified'] and d['visible_vertices']==10756
          assert d['target_count']==11 and len(d['morph_source_comparison'])==11
          assert not d['photorealism_approved']
          print('BLENDER_REAL_SOURCE_INERT_MASK_MORPHS',d['inert_visible_target_indices'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afro-original-morph-masked-source-deltas
          path: artifacts/afro-visible-morph-forensic/
          retention-days: 7
          if-no-files-found: warn
