name: Blank Engine - Einar verified source shaded face proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install software renderer and pinned Blender/Pillow
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 xvfb
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3 Pillow==11.3.0
      - name: Download verified CC-BY Einar v1 official asset
        run: |
          mkdir -p .ci-einar artifacts/hero-v4-einar
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 540 --silent --show-error \
            'https://studio.blender.org/download-source/files/41/419e83fb75f30b989adf7920dec7a21c/419e83fb75f30b989adf7920dec7a21c.zip' \
            -o .ci-einar/einar-official.zip
          python3 -m py_compile experiments/hero-v4/restore_textures.py experiments/hero-v4/render_shaded.py experiments/hero-v4/preview_sheet.py
          python3 experiments/hero-v4/restore_textures.py
      - name: Load original face/eyes with all source textures, render real Cycles head closeups
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OMP_NUM_THREADS: '4'
        run: |
          set +e
          timeout -k 12s 490s xvfb-run -a python3 experiments/hero-v4/render_shaded.py
          result=$?
          echo "EINAR_V4_BLENDER_EXIT_CODE=$result"
          set -e
          python3 experiments/hero-v4/preview_sheet.py
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/hero-v4-einar/shaded-preview-audit.json')
          assert p.exists(),'No shader/texture audit persisted'
          x=json.loads(p.read_text())
          print('EINAR_V4_PREVIEW_GATE',x['status'],'textures',x.get('images_loaded'),x.get('images_total'),'shots',len(x.get('images',[])))
          assert x.get('critical_skin_albedo_loaded'),'Actual skin map not loaded'
          assert x.get('critical_eye_albedo_loaded'),'Actual eye albedo not loaded'
          assert len(x.get('images',[]))==5,'Five genuine source shaded views not captured'
          assert x['status']=='FIVE_SHADED_SHOTS_RENDERED_NEEDS_HUMAN_REVIEW'
          assert x['human_visual_approval']=='BLOCKED'
          print('EINAR_V4_SHADED_SOURCE_TECHNICAL_PASS_NOT_HUMAN_APPROVED')
          PY
      - name: Unchanged Blank Engine regression
        if: always()
        run: npm test
      - name: Archive only shaded review images and audit, NOT publisher's original ZIP or blend
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blank-hero-v4-einar-shaded-review
          path: artifacts/hero-v4-einar/
          retention-days: 7
          if-no-files-found: warn
