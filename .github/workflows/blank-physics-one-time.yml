# Temporary integration verification for approved Alpha 0.6 development.
# Triggered only by creation/change of THIS file, not by future source pushes.
# Delete after verifying the real Three/Rapier smoke. Does NOT deploy to Vercel.
name: Blank Engine - one-time real physics and rig check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-physics-one-time.yml'
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install engine dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned integration libraries without saving
        run: npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.18.0
      - name: Run regression tests
        run: npm test
      - name: Run real Three and Rapier integration smoke
        run: node scripts/physics-real-smoke.mjs
