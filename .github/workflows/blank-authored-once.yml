# Temporary, one-use scoped GitHub test. Removed after a successful run; no Vercel deployment and no secrets.
name: Blank Engine - one-time authored PBR integration
on:
  push:
    paths:
      - scripts/authored-browser-smoke.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned real browser and engine libraries
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.18.0 playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run regression tests
        run: npm test
      - name: Real Three.js material smoke
        run: |
          node scripts/material-real-smoke.mjs
          node scripts/authored-real-smoke.mjs
      - name: Real Chrome PBR upload, lifecycle and mobile tests
        run: node scripts/authored-browser-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: blank-alpha06-authored-pbr-browser
          path: artifacts/alpha06-authored-textures.png
          if-no-files-found: ignore
