# One-time scoped push validation. Remove after passing; NEVER deploy from CI.
name: Blank Engine - one-time full CC0 catalog and mobile viewport validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-cc0-catalog-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cc0-all:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned engine and Chrome test dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.18.0 playwright@1.56.1
      - name: Run regressions
        run: npm test
      - name: Download, authenticate and record all five CC0 material sets
        run: node scripts/prepare-material-library.mjs --out . --resolution 1k
      - name: Validate all maps and measure Chrome mobile viewport proxy
        run: node scripts/cc0-catalog-acceptance.mjs
      - name: Upload full pack, manifests and five real Chrome screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blank-alpha06-full-cc0-mobile-proxy
          path: |
            library/
            artifacts/alpha06-*-mobile.png
            artifacts/alpha06-mobile-proxy-report.json
          retention-days: 7
          if-no-files-found: warn
