name: EXPERIMENTAL Coherent Afro Hair Field One Shot
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exact previously scalp-attached full Blender character and render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source artifacts/afro-coherent-field
          gh run download 39129920528 --repo autonomousagentuniverse/blank-engine-lab --name surface-rooted-afro-real-blender-a-b --dir source
          printf '79d09a8a44ad0ed27300a37203196551f4ad0267e181ab743f28fa43f4d1a4cc  source/afro_woman_surface_rooted_prototype.blend\n' | sha256sum -c -
          cp source/face_surface_rooted.png artifacts/afro-coherent-field/face_previous_spiky.png
      - name: Build full hair guide field and real Blender Cycles camera-matched render
        env:
          OMP_NUM_THREADS: '4'
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3
          python3 -m py_compile character-pipeline/references/build_coherent_afro_field.py
          timeout -k 15s 1010s python3 -u character-pipeline/references/build_coherent_afro_field.py
      - name: Verify hashes, consistent roots and no automatic visual approval
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json
          d=pathlib.Path('artifacts/afro-coherent-field')
          j=json.loads((d/'coherent-report.json').read_text())
          assert j['input_sha256']=='79d09a8a44ad0ed27300a37203196551f4ad0267e181ab743f28fa43f4d1a4cc'
          assert j['strands']==4450 and j['guide_count']>=80
          assert j['source_scalp_triangles']==668
          assert j['candidate_root_gap_max_mm']<.1
          assert j['root_displacement_max_mm']<.001
          assert j['nearest_neighbor_guide_cos_median']>.8
          assert j['source_unchanged'] and not j['release_allowed']
          assert not j['photorealism_approved'] and not j['webgl_parity']
          for f,k in [('face_coherent_afro.png','render_sha256'),
                      ('afro_woman_coherent_field_candidate.blend','blend_sha256')]:
            p=d/f;assert p.stat().st_size>60000
            assert hashlib.sha256(p.read_bytes()).hexdigest()==j[k]
          assert (d/'face_previous_spiky.png').stat().st_size>80000
          print('ACTUAL_COHERENT_HAIR_GEOMETRY_AND_RENDER_TEST_SUCCESS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coherent-afro-one-shot-blender-a-b
          path: artifacts/afro-coherent-field/
          retention-days: 7
          if-no-files-found: warn
