name: EXPERIMENTAL Anatomy Structure Discovery (One Shot)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recover the exact validated human Blender asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source artifacts/semantic-anatomy
          gh run download 39090435514 --repo autonomousagentuniverse/blank-engine-lab --name user-afro-woman-body-final-real-blender --dir source
          sha256sum source/afro_woman_darkskin_medium_build_final.blend
      - name: Install actual Blender Python and run shape/bone forensics
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3
          python3 -m py_compile character-pipeline/references/inspect_afro_source_blender.py
          OMP_NUM_THREADS=4 timeout -k 10s 450s python3 -u character-pipeline/references/inspect_afro_source_blender.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: human-anatomy-source-forensic
          path: artifacts/semantic-anatomy/
          retention-days: 7
          if-no-files-found: warn
