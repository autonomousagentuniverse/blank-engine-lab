name: Blank Engine - one-time independently authored CC0 material check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-cc0-material-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cc0:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned libraries and browser runner
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.18.0 playwright@1.56.1
      - name: Validate catalog and regression suites
        run: npm test
      - name: Prepare genuine independently authored material
        run: node scripts/prepare-material-library.mjs --only asphalt_02 --out . --resolution 1k
      - name: Verify genuine CC0 material in Chrome
        run: node scripts/cc0-browser-smoke.mjs
      - name: Save audited material evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blank-alpha06-cc0-material-test
          path: |
            library/
            artifacts/alpha06-polyhaven-material.png
          retention-days: 7
# Browser smoke rerun after non-negative RAF frame delta guard; one-time only.
