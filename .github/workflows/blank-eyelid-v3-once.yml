name: Blank Engine - one-time topology-aware eyelid candidate QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-eyelid-v3-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install browser libraries
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 playwright@1.56.1
      - name: Fetch source and build corrected hero
        run: |
          mkdir -p .ci-assets artifacts
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/kunalkushwaha/vsim/3f97faf85e46d2f9a122b0a8b8d3ccc0af598f91/packages/assets/library/suited.glb' -o .ci-assets/suited.glb
          node scripts/hero-eyes-build.mjs .ci-assets/suited.glb .ci-assets/hero-v22.glb
      - name: Full regression and v3 real fixture tests
        run: |
          npm test
          BLANK_EYE_GLTF_FIXTURE=.ci-assets/hero-v22.glb node --test test/eyelid-reconstruction.test.mjs
      - name: Produce reversible lid candidate
        run: node scripts/build-eyelids.mjs .ci-assets/hero-v22.glb .ci-assets/hero-lid-v3.glb artifacts/hero-lid-v3.geometry.json
      - name: Real Three.js and Chrome headshot QA
        run: node scripts/eyelid-v3-browser-smoke.mjs
      - name: Archive comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blank-eyelid-v3-visual-evidence
          path: |
            artifacts/hero-v3-*.png
            artifacts/hero-lid-v3.geometry.json
          retention-days: 7
          if-no-files-found: ignore
