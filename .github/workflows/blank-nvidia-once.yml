# Temporary approved integration check, retry after low-reasoning configuration.
name: Blank Engine - one-time authorized NVIDIA integration check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-nvidia-once.yml'
permissions:
  contents: read
jobs:
  integration:
    if: github.event.head_commit.message == 'nvidia-smoke-once-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Local test suite
        run: npm test
      - name: NVIDIA single-request authentication check
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/nvidia-smoke.mjs
      - name: NVIDIA six-agent GameSpec trial
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/ai-demo.mjs
