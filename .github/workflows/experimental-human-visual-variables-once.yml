name: EXPERIMENTAL Human Variable Contract and Blender Bindings Once
on:
  workflow_dispatch:
  push:
    branches:
      - research/human-reference-atlas-20261018
    paths:
      - .github/workflows/experimental-human-visual-variables-once.yml
permissions:
  contents: read
  actions: read
jobs:
  contract-and-real-blender:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Execute strict JSON contract validation and negative tests
        run: |
          node --check character-pipeline/one-shot/human-visual-variables.mjs
          node --check character-pipeline/one-shot/human-variables-cli.mjs
          node --test character-pipeline/one-shot/human-visual-variables.test.mjs
          node character-pipeline/one-shot/human-variables-cli.mjs validate-contracts
          python3 -m json.tool character-pipeline/contracts/human_visual_variable_system.v1.json >/dev/null
          python3 -m json.tool character-pipeline/contracts/human_defect_taxonomy.v1.json >/dev/null
          python3 -m json.tool character-pipeline/contracts/teacher_delta_proposal.v1.json >/dev/null
          python3 -m json.tool character-pipeline/contracts/render_evaluation_report.v1.json >/dev/null
      - name: Compile evidence-bound camera/renderer variables to an actual Blender config
        run: |
          mkdir -p artifacts/blank-genuine-full-body
          node character-pipeline/one-shot/human-variables-cli.mjs compile character-pipeline/one-shot/human-visual-example.request.json artifacts/blank-genuine-full-body/blender-human-visual-config.json
          python3 - <<'PY'
          import json
          f='artifacts/blank-genuine-full-body/blender-human-visual-config.json'
          a=json.load(open(f));c=a['controls']
          assert a['schema']=='blank.human.blender-render-config.v1'
          assert c['camera.margin']==.085
          assert c['camera.three_quarter_orbit_degrees']==27
          assert c['render.cycles_samples']==32
          assert a['actual_geometry_changed'] is False
          assert a['release_allowed'] is False and a['image_generation_used'] is False
          print('COMPILER_OUTPUT_BINDS_TO_ACTUAL_BLENDER_RENDERER',c)
          PY
      - name: Retrieve original pinned Blender character for non-imagegen test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source
          gh run download 39143615834 --repo autonomousagentuniverse/blank-engine-lab --name afro-mask-respected-geometry-and-glb --dir source
          printf 'a1c38165ae2d8d100e04919e4e57b35623ac9fabc1b0d2cb44bdfb7829fef570  source/afro_mask_respected_uv_pbr.blend\n' | sha256sum -c -
      - name: Apply only four real variables in Blender and render 3 full-body Cycles shots
        env:
          OMP_NUM_THREADS: '4'
          BLANK_HUMAN_RENDER_CONFIG: artifacts/blank-genuine-full-body/blender-human-visual-config.json
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3 numpy pillow
          python3 -m py_compile character-pipeline/references/one_shot_actual_full_body.py
          timeout -k 20s 1120s python3 -u character-pipeline/references/one_shot_actual_full_body.py
      - name: Assert actual 3-angle Blender binding execution and source preservation
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('artifacts/blank-genuine-full-body')
          j=json.loads((root/'actual-full-body-report.json').read_text())
          a=j['control_provenance']
          assert a['compiled_config_applied'] and a['margin_fraction']==.085
          assert a['three_quarter_degrees']==27 and a['cycles_samples']==32
          assert a['unimplemented_controls_applied']==[]
          assert set(x['name'] for x in j['shots'])=={'front','three_quarter_27','profile_90'}
          assert j['render']['samples']==32 and j['bone_count']==53
          assert j['source_unchanged'] and not j['mesh_geometry_changed']
          assert not j['photoreal_human_approved'] and not j['production_deployed']
          for q in j['shots']+[j['editable_blend']]:
            path=root/q['path']
            assert path.stat().st_size==q['bytes']
            assert hashlib.sha256(path.read_bytes()).hexdigest()==q['sha256']
          print('REAL_BLENDER_HUMAN_VARIABLE_BINDINGS_CONFIRMED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: human-visual-variable-v1-blender-integration
          path: |
            artifacts/blank-genuine-full-body/*.json
            artifacts/blank-genuine-full-body/*.png
            artifacts/blank-genuine-full-body/*.blend
          retention-days: 7
          if-no-files-found: warn
