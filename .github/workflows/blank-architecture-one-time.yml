# Narrowly scoped one-time validation. Removed after result; no deployment.
name: Blank Engine - one-time architectural visual and WebGL regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-architecture-one-time.yml'
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install real graphics and physics dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.18.0 playwright@1.56.1
      - name: Run regression suite
        run: npm test
      - name: Verify 3D Night Market architecture in real Chrome
        run: node scripts/architecture-browser-smoke.mjs
      - name: Upload actual screenshots and budget evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blank-alpha06-architecture-qa
          path: artifacts/alpha06-architecture-*
          retention-days: 7
