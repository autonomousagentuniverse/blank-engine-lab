# Single use, approved validation only. No Vercel deployment or secret access.
name: Blank Engine - one-time Alpha 0.6 browser and IK integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-ik-integration-once.yml'
permissions:
  contents: read
jobs:
  integration:
    if: github.event.head_commit.message == 'test-ik-browser-authorized-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned browser and physics test libraries
        run: npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.18.0 playwright@1.56.1
      - name: Run full regression tests
        run: npm test
      - name: Run real Three and Rapier IK smoke
        run: |
          node scripts/physics-real-smoke.mjs
          node scripts/avatar-real-smoke.mjs
          node scripts/ik-real-smoke.mjs
      - name: Run real Chrome 3D integration
        run: node scripts/browser-integration.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blank-engine-alpha06-ik-browser
          path: artifacts/alpha06-ik-browser.png
          if-no-files-found: ignore
          retention-days: 7
