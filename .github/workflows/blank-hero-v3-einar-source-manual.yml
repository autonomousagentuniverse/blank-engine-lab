name: Blank Engine - Einar official licensed source gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and validate source resolver
        run: |
          python3 -m py_compile experiments/hero-v3/einar_public_source.py
      - name: Inspect publisher character page and downloadable files without credentials
        run: |
          python3 experiments/hero-v3/einar_public_source.py
      - name: Assert honest gate semantics
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('artifacts/hero-v3-einar/source-resolution.json'))
          assert p['publisher']=='Blender Studio'
          assert p['visual_approval']=='BLOCKED'
          assert p['source_hash_verified'] is False
          assert p['rig_and_blink_verified'] is False
          assert p['threejs_glb_verified'] is False
          assert p['status'].startswith(('BLOCKED_','DIRECT_PUBLIC_BINARY_FOUND_'))
          print('EINAR_SOURCE_GATE_AUDITED',p['status'])
          PY
      - name: Download verified official Einar archive (no credentials or mirrors)
        run: |
          mkdir -p .ci-einar
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 540 --silent --show-error \
            'https://studio.blender.org/download-source/files/41/419e83fb75f30b989adf7920dec7a21c/419e83fb75f30b989adf7920dec7a21c.zip' \
            -o .ci-einar/einar-official.zip
      - name: Hash and verify the exact ZIP, embedded license, Blender sources and texture assets
        run: |
          python3 -m py_compile experiments/hero-v3/einar_archive_audit.py
          python3 experiments/hero-v3/einar_archive_audit.py
      - name: Install Blender for real rig/skin/eye/texture inventory
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 xvfb
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3
      - name: Inspect Blender model structures without rendering or mutating source
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 -m py_compile experiments/hero-v3/einar_blender_inspect.py
          timeout -k 8s 135s xvfb-run -a python3 experiments/hero-v3/einar_blender_inspect.py || {
            echo "EINAR_BLENDER_FULL_LOAD_BLOCKED_OR_TIMED_OUT; preserving archive audit, NOT claiming rig validated"
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/hero-v3-einar/model-audit.json")
          if p.exists():
            try:
              d=json.loads(p.read_text())
            except Exception:
              d={}
          else:
            d={}
          loaded=any(x.get('status')=='loaded' for x in d.get('source_files',[]))
          d.update({"schema":"blank.hero-v3.einar-model-audit.v1",
                    "status":"BLENDER_INVENTORY_CAPTURED_SHUTDOWN_TIMEOUT" if loaded else "BLOCKED_FULL_MODEL_LOAD_TIMEOUT_OR_ERROR",
                    "rig_and_blend_eyes_verified":bool(loaded),"photorealism_approved":False,
                    "note":"Blender scene inventory persisted with real mesh/rig contents before process shutdown timed out" if loaded else "Full scene load did not produce inventory within resource budget."})
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
          }
      - name: Unchanged engine regression
        run: npm test
      - name: Archive only source resolution report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blank-hero-v3-einar-official-source-gate
          path: artifacts/hero-v3-einar/
          retention-days: 7
          if-no-files-found: warn
