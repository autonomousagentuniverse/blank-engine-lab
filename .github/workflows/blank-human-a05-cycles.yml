name: HUMAN-A05 — actual rig-driven brow, eliminate sourced strap in Cycles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-render:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install source-compatible Blender Cycles
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3 Pillow==11.3.0
      - name: Restore exact Einar publisher CC-BY source
        run: |
          mkdir -p .ci-einar artifacts/human-a05
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 540 --silent --show-error \
            'https://studio.blender.org/download-source/files/41/419e83fb75f30b989adf7920dec7a21c/419e83fb75f30b989adf7920dec7a21c.zip' \
            -o .ci-einar/einar-official.zip
          python3 experiments/hero-v4/restore_textures.py
          python3 -m py_compile experiments/human-a05/generate_and_render.py
      - name: Adjust source rig bone controls and remove exact sourced clothing, render Cycles
        env:
          OMP_NUM_THREADS: '4'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout -k 15s 780s python3 -u experiments/human-a05/generate_and_render.py
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/human-a05')
          r=json.loads((p/'report.json').read_text())
          assert r['status'].startswith('A05_RIG_BROW_AND_CLOTHING_ISOLATED')
          assert len(r['renders'])==1
          assert (p/'front.png').stat().st_size>7000
          assert (p/'human-a05-rig-neutral-no-strap.blend').stat().st_size>100000
          assert r['a03_brow_expression']['source_brow_drivers_left_active']
          assert not r['a03_brow_expression']['driver_mismatch'],r['a03_brow_expression']['driver_mismatch']
          assert any(x['name']=='GEO-satchel_strap' for x in r['a05_unlinked_source_clothing'])
          assert r['human_visual_approval']=='BLOCKED'
          print('HUMAN_A05_RIG_AND_CLOTHING_TECHNICAL_PASS_NOT_VISUAL')
          PY
      - name: Archive only derived .blend, audit, actual Cycles PNG
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-a05-rig-neutral-clothing-isolation
          path: artifacts/human-a05/
          retention-days: 7
          if-no-files-found: warn
