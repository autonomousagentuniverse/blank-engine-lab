name: EXPERIMENTAL Coherent Afro Head Pose and Multiview
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-blender-pose-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recover immutable coherent Afro character
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source artifacts/head-pose-afro
          gh run download 39130834258 --repo autonomousagentuniverse/blank-engine-lab --name coherent-afro-one-shot-blender-a-b --dir source
          printf '327befea50b2961d1ff3341fdf2e7b6bb173f7c74c09212c68061677a974b3f2  source/afro_woman_coherent_field_candidate.blend\n' | sha256sum -c -
      - name: Measure evaluated scalp / bone-parented root mismatch and render four views
        env:
          OMP_NUM_THREADS: '4'
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3
          python3 -m py_compile character-pipeline/references/audit_head_pose_afro.py
          timeout -k 15s 990s python3 -u character-pipeline/references/audit_head_pose_afro.py
      - name: Validate provenance, real render bytes, and honest fail-closed flags
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          d=pathlib.Path('artifacts/head-pose-afro')
          j=json.loads((d/'head-pose-report.json').read_text())
          assert j['source_sha256']=='327befea50b2961d1ff3341fdf2e7b6bb173f7c74c09212c68061677a974b3f2'
          assert j['source_unchanged'] and j['root_count']==4450 and len(j['poses'])==4
          assert len(j['renders'])==4 and not j['photorealism_approved'] and not j['release_allowed']
          assert not j['visual_owner_approved'] and not j['webgl_parity']
          assert j['pose_attachment_pass']==all(p['pass'] for p in j['poses'][1:])
          for image in j['renders']:
              p=d/image['file']
              assert p.stat().st_size>45000
              assert hashlib.sha256(p.read_bytes()).hexdigest()==image['sha256']
          p=d/'afro_head_pose_inspection.blend'
          assert p.stat().st_size>10000000
          assert hashlib.sha256(p.read_bytes()).hexdigest()==j['derivative_sha256']
          print('REAL_BLENDER_POSE_AND_MULTIVIEW_VERIFIED_PASS_OR_HONEST_FAIL')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afro-pose-and-multiview-blender-v1
          path: artifacts/head-pose-afro/
          retention-days: 7
          if-no-files-found: warn
