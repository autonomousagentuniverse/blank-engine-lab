name: Experiment skinbound hair - geometry regression
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  human-skinbound:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recover exact previously rendered character
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source artifacts/afro-skinbound-hair
          gh run download 39130834258 --repo autonomousagentuniverse/blank-engine-lab --name coherent-afro-one-shot-blender-a-b --dir source
          printf '327befea50b2961d1ff3341fdf2e7b6bb173f7c74c09212c68061677a974b3f2  source/afro_woman_coherent_field_candidate.blend\n' | sha256sum -c -
      - name: Validate math, compile Python and install real Blender
        run: |
          python3 character-pipeline/references/test_skinbound_math.py
          python3 -m py_compile character-pipeline/references/build_skinbound_afro.py
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3
      - name: Execute Blender hair weight transfer and all pose measurements
        env:
          OMP_NUM_THREADS: '4'
        run: |
          timeout -k 15s 1060s python3 -u character-pipeline/references/build_skinbound_afro.py
      - name: Enforce original head-motion follicle tolerances
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          d=pathlib.Path('artifacts/afro-skinbound-hair')
          j=json.loads((d/'skinbound-report.json').read_text())
          assert j['source_sha256']=='327befea50b2961d1ff3341fdf2e7b6bb173f7c74c09212c68061677a974b3f2'
          assert j['source_unchanged'] and j['hair_count']==4450 and j['original_nurbs_retained']
          assert len(j['pose_tests'])==4 and j['tolerances']=={'p95_mm':2.0,'max_mm':5.0}
          assert all(p['pass'] for p in j['pose_tests']) and j['skinbound_geometry_pass'],'REAL_POSE_GEOMETRY_REJECTED'
          assert not j['photorealism_approved'] and not j['release_allowed'] and not j['rigged_export_glb_verified']
          blend=d/'afro_skinbound_hair_derivative.blend'
          assert blend.stat().st_size>10000000
          assert hashlib.sha256(blend.read_bytes()).hexdigest()==j['derivative_sha256']
          print('TRUE_BLENDER_HEAD_POSE_FOLLICLE_TEST_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afro-skinbound-geometry-regression-20261018
          path: artifacts/afro-skinbound-hair/
          retention-days: 7
          if-no-files-found: warn
