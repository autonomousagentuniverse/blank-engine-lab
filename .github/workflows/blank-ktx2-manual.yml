# Manual-only Alpha 0.6 GPU texture regression. Never deploys to Vercel.
name: Blank Engine - manual KTX2 GPU texture QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ktx2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned engine and browser libraries
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.18.0 playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Download pinned real KTX2 Basis Universal asset
        run: |
          mkdir -p .ci-assets
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/mrdoob/three.js/r186/examples/textures/ktx2/2d_uastc.ktx2 \
            -o .ci-assets/sample_uastc.ktx2
          test "$(wc -c < .ci-assets/sample_uastc.ktx2)" -gt 128
      - name: All regression tests and offline conversion CLI contract
        run: |
          npm test
          node scripts/encode-ktx2.mjs source.png output.ktx2 --normal --high --dry-run
      - name: Real WebGL and KTX2 transcoding
        run: node scripts/ktx2-browser-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: blank-alpha06-ktx2-chrome
          path: artifacts/alpha06-ktx2-chrome.png
          if-no-files-found: ignore
