# One-time scoped integration run. No deployment, credentials, or Vercel access.
# After validation this file is removed; permanent test workflows remain manual-only.
name: Blank Engine - one-time imported avatar calibration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-calibration-once.yml'
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned physics, avatar and browser test libraries
        run: npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.18.0 playwright@1.56.1
      - name: Run the full regression suite
        run: npm test
      - name: Real imported GLB proportion and IK calibration
        run: node scripts/avatar-calibration-smoke.mjs
      - name: Existing real Rapier and rig integration
        run: node scripts/physics-real-smoke.mjs && node scripts/motion-real-smoke.mjs
      - name: Browser GLB import, physics and scene integration
        run: node scripts/browser-integration.mjs
      - name: Retain browser screenshot for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blank-calibration-browser
          path: artifacts/alpha06-ik-browser.png
          if-no-files-found: ignore
