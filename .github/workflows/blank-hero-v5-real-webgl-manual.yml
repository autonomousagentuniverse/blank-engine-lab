name: Blank Engine - Einar actual Three.js WebGL screenshot proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webgl-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned source and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 xvfb
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3 Pillow==11.3.0
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 playwright@1.56.1
      - name: Download genuine Einar and verify publisher ZIP / restore 63 source textures
        run: |
          mkdir -p .ci-einar artifacts/hero-v5-einar
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 540 --silent --show-error \
            'https://studio.blender.org/download-source/files/41/419e83fb75f30b989adf7920dec7a21c/419e83fb75f30b989adf7920dec7a21c.zip' \
            -o .ci-einar/einar-official.zip
          python3 experiments/hero-v4/restore_textures.py
          python3 -m py_compile experiments/hero-v5/export_einar_runtime.py experiments/hero-v5/validate_glb.py
      - name: Export COPY ONLY of genuine anatomical head and eyes to glTF PBR
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OMP_NUM_THREADS: '4'
        run: |
          set +e
          timeout -k 10s 410s xvfb-run -a python3 -u experiments/hero-v5/export_einar_runtime.py
          result=$?
          echo "EINAR_V5_BLENDER_PROCESS_EXIT=$result"
          set -e
          test -s artifacts/hero-v5-einar/einar-static-pbr.glb
          python3 experiments/hero-v5/validate_glb.py
      - name: Verify unchanged Blank Engine runtime regressions
        run: npm test
      - name: Render directly in Blank Engine Three.js with real Chrome WebGL2
        run: |
          node --check experiments/hero-v5/chrome_smoke.mjs
          node experiments/hero-v5/chrome_smoke.mjs
          python3 experiments/hero-v5/montage.py
      - name: Archive real WebGL screenshot evidence, derived GLB and audits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blank-hero-v5-real-webgl-proof
          path: artifacts/hero-v5-einar/
          retention-days: 7
          if-no-files-found: warn
