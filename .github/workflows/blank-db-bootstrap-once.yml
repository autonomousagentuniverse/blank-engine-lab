# Single-use bootstrap. Remove this workflow after execution.
# User explicitly approved database initialization; never use this for normal releases.
name: Blank Engine - approved one-time DB bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-db-bootstrap-once.yml'

permissions:
  contents: read
concurrency:
  group: blank-engine-db-maintenance
  cancel-in-progress: false

jobs:
  migrate-once:
    if: github.event.head_commit.message == 'db-bootstrap-authorized-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies safely
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate project tests
        run: npm test
      - name: Apply explicitly authorized Blank Engine schema migration
        env:
          BLANK_PG_URL: ${{ secrets.BLANK_PG_URL }}
        run: node scripts/db-admin.mjs migrate
      - name: Verify all six Blank Engine tables
        env:
          BLANK_PG_URL: ${{ secrets.BLANK_PG_URL }}
        run: node scripts/verify-schema.mjs
