name: Blank Engine - one-time licensed hero character lab browser QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-character-lab-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  character-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Three.js and Chrome browser tools
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 playwright@1.56.1
          npx playwright install chrome
      - name: Acquire pinned CC0 MakeHuman reference
        run: |
          mkdir -p character-lab/assets
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/kunalkushwaha/vsim/3f97faf85e46d2f9a122b0a8b8d3ccc0af598f91/packages/assets/library/suited.glb' -o character-lab/assets/hero.glb
      - name: Validate GLB identity, asset metadata and full regression suite
        run: |
          node scripts/character-lab-audit.mjs character-lab/assets/hero.glb
          npm test
      - name: Check isolated human character in real WebGL Chrome
        run: node scripts/character-lab-browser.mjs
      - name: Preserve screenshot and source-asset evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blank-character-lab-real-asset-evidence
          path: |
            artifacts/character-lab-hero-*.png
            character-lab/assets/hero.glb
          if-no-files-found: ignore
          retention-days: 7
