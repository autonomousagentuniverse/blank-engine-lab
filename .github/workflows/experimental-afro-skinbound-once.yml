name: EXPERIMENTAL Deformation-aware Afro Follicle Skin Binding
on:
  workflow_dispatch:
  push:
    branches:
      - research/human-reference-atlas-20261018
    paths:
      - .github/workflows/experimental-afro-skinbound-once.yml
permissions:
  contents: read
  actions: read
jobs:
  real-blender-skinbound:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recover the exact immutable coherent-Afro Blender source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source artifacts/afro-skinbound-hair
          gh run download 39130834258 --repo autonomousagentuniverse/blank-engine-lab --name coherent-afro-one-shot-blender-a-b --dir source
          printf '327befea50b2961d1ff3341fdf2e7b6bb173f7c74c09212c68061677a974b3f2  source/afro_woman_coherent_field_candidate.blend\n' | sha256sum -c -
      - name: Run the physical Blender skinned follicle attachment experiment
        env:
          OMP_NUM_THREADS: '4'
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3
          python3 -m py_compile character-pipeline/references/build_skinbound_afro.py
          timeout -k 20s 1160s python3 -u character-pipeline/references/build_skinbound_afro.py
      - name: Authenticate real Blender outputs and preserve pass/fail result
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          d=pathlib.Path("artifacts/afro-skinbound-hair")
          j=json.loads((d/"skinbound-report.json").read_text())
          assert j["source_sha256"]=="327befea50b2961d1ff3341fdf2e7b6bb173f7c74c09212c68061677a974b3f2"
          assert j["source_unchanged"] and j["hair_count"]==4450 and len(j["pose_tests"])==4
          assert j["original_nurbs_retained"] and j["meshes"]==3
          assert j["skinbound_geometry_pass"]==all(p["pass"] for p in j["pose_tests"])
          assert not j["photorealism_approved"] and not j["rigged_export_glb_verified"] and not j["release_allowed"]
          p=d/"afro_skinbound_hair_derivative.blend"
          assert p.stat().st_size>10000000
          assert hashlib.sha256(p.read_bytes()).hexdigest()==j["derivative_sha256"]
          print("SKINBOUND_RUNTIME_AUDIT_COMPLETE_WITH_HONEST_PASS_OR_FAIL")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afro-skinbound-deformation-real-blender
          path: artifacts/afro-skinbound-hair/
          retention-days: 7
          if-no-files-found: warn

# Retrigger after correcting the Python ARMATURE modifier API syntax.
