name: Experimental Einar vs MIRA anatomical-dependency decomposition
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-anatomical-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Get authenticated reference source-graph metadata from prior actual Blender inspection
        run: |
          mkdir -p reference/einar artifacts/human-reference-decomposition
          git fetch --no-tags --depth=1 origin b2ef409e6dfe9caafafe39a3c2c66d9554d7e1ca
          git show FETCH_HEAD:docs/source-audits/einar-source-graph.json.gz > reference/einar-source-graph.json.gz
          python3 - <<'PY'
          import gzip,json,pathlib
          j=json.loads(gzip.decompress(pathlib.Path("reference/einar-source-graph.json.gz").read_bytes()))
          assert j["blend_sha256"]=="1c6663da0a2e9d6822978467c244e9186edc76083bae2414e02f9e695e711f7b"
          assert any(x["name"]=="GEO-einar_head" for x in j["objects"])
          print("AUTHENTIC_EINAR_REFERENCE_GRAPH_VERIFIED")
          PY
      - name: Download previously generated complete MIRA one-shot A candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reference/mira-a
          gh run download 39074108104 --repo autonomousagentuniverse/blank-engine-lab --name abc-human-A --dir reference/mira-a
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path("reference/mira-a/complete_A.blend")
          assert p.stat().st_size>15000000
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="9b57bc2aaa1ba0cfec213eb1035f517dfbcebf5fb43443cc85618f42bb39791e"
          print("ONE_SHOT_MIRA_A_IMMUTABLE_CANDIDATE_VERIFIED")
          PY
      - name: Execute real Blender anatomical/deformation relationship test
        run: |
          python3 -m pip install --no-cache-dir --disable-pip-version-check bpy==4.5.3
          python3 -m py_compile experiments/reference-decomposition/decompose.py
          timeout -k 10s 540s python3 -u experiments/reference-decomposition/decompose.py
      - name: Validate report without claiming photorealism
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("artifacts/human-reference-decomposition/reference-vs-mira.json")
          d=json.loads(p.read_text())
          assert d["reference"]["animation_rig_bones"]>=700
          assert d["structural_gaps"]["reference_has_separate_cornea"]
          assert d["structural_gaps"]["reference_face_eyelash_surface_deformation"]
          assert not d["new_human_generated"] and not d["release_allowed"]
          for k,m in d["candidate"]["movement_follow_probes"].items():
            assert m["sample_count"]>=1 and m["expected_if_bound_median_mm"]>5
          print("ANATOMICAL_STRUCTURAL_COMPARISON_VERIFIED")
          PY
      - name: Keep only audit JSON and report, never publisher assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-reference-source-decomposition-einar-vs-mira
          path: artifacts/human-reference-decomposition/
          retention-days: 7
          if-no-files-found: warn
