name: HUMAN-A03 real neutral brow and short scalp groom
on:
  push:
    branches: [experiment/human-a03-neutral-expression-hair]
    paths: ['.github/workflows/blank-human-a03-cycles.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-a03:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned actual Blender and Pillow
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3 Pillow==11.3.0
      - name: Restore verified official Einar CC-BY source and maps
        run: |
          mkdir -p .ci-einar artifacts/human-a03
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 540 --silent --show-error \
            'https://studio.blender.org/download-source/files/41/419e83fb75f30b989adf7920dec7a21c/419e83fb75f30b989adf7920dec7a21c.zip' \
            -o .ci-einar/einar-official.zip
          python3 experiments/hero-v4/restore_textures.py
          python3 -m py_compile experiments/human-a03/generate_and_render.py experiments/human-a03/contact_sheet.py
      - name: Real Blender brow and groom changes plus Cycles render
        env:
          OMP_NUM_THREADS: '4'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout -k 15s 900s python3 -u experiments/human-a03/generate_and_render.py
          python3 experiments/human-a03/contact_sheet.py
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('artifacts/human-a03')
          d=json.loads((p/'report.json').read_text())
          assert d['status'].startswith('A03_NEUTRAL_BROW_AND_NEW_SHORT_GROOM_FOUR_CYCLES_RENDERS')
          assert len(d['renders'])==4
          assert d['a03_short_groom']['procedural_strands']>=3000
          assert len(d['a03_brow_expression']['requested_shape_values'])==4
          assert d['human_visual_approval']=='BLOCKED'
          assert (p/'human-a03-neutral-groom.blend').stat().st_size>100000
          print('A03_REAL_BLENDER_CYCLES_VERIFIED')
          PY
      - name: Archive actual .blend and all renders, never the publisher source ZIP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: human-a03-neutral-expression-groom
          path: artifacts/human-a03/
          retention-days: 7
          if-no-files-found: warn
