name: EXPERIMENTAL True New Body Mesh One Shot Blender Cycles
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  complete-new-body:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check original topology builder source syntax
        run: |
          python3 -m py_compile character-pipeline/references/construct_independent_anatomy.py character-pipeline/references/one_shot_actual_full_body.py
      - name: Recover original SHA pinned head and rig in Blender
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source
          gh run download 39143615834 --repo autonomousagentuniverse/blank-engine-lab --name afro-mask-respected-geometry-and-glb --dir source
          printf 'a1c38165ae2d8d100e04919e4e57b35623ac9fabc1b0d2cb44bdfb7829fef570  source/afro_mask_respected_uv_pbr.blend\n' | sha256sum -c -
      - name: Install genuine Blender 4.5.3 Cycles Python
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3 numpy pillow
          mkdir -p artifacts/original-body artifacts/new-independent-body
      - name: Real original three-angle Cycles render
        env:
          BLANK_HUMAN_OUTPUT_DIR: artifacts/original-body
          BLANK_HUMAN_STUDIO_BACKGROUND: '1'
          OMP_NUM_THREADS: '4'
        run: |
          timeout -k 20s 1000s python3 -u character-pipeline/references/one_shot_actual_full_body.py
      - name: Construct NEW Blender body vertex topology, preserve original face
        env:
          BLANK_HUMAN_OUTPUT_DIR: artifacts/new-independent-body
          BLANK_HUMAN_STUDIO_BACKGROUND: '1'
          BLANK_HUMAN_NEW_BODY_TOPOLOGY: '1'
          OMP_NUM_THREADS: '4'
        run: |
          timeout -k 20s 1000s python3 -u character-pipeline/references/one_shot_actual_full_body.py
      - name: Validate new topology and true Blender rendered shots
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,base64,io
          import numpy as np
          from PIL import Image
          root=pathlib.Path("artifacts")
          a=json.loads((root/"original-body/actual-full-body-report.json").read_text())
          b=json.loads((root/"new-independent-body/actual-full-body-report.json").read_text())
          n=b['independent_anatomy_mesh']
          assert not a['mesh_geometry_changed'] and b['mesh_geometry_changed']
          assert n['applied'] and n['new_independent_body_mesh']
          assert n['source_face_topology_preserved'] and n['source_head_reused']
          assert n['new_body_verts']>1500 and n['new_body_polygons']>1200
          assert not n['old_width_sliders_invoked'] and not n['original_body_morph_reused']
          assert not b['body_morphology']['applied'] and not b['anatomical_reconstruction']['applied']
          assert a['source_blend_sha256']==b['source_blend_sha256']
          assert a['revised_world_studio_background']==b['revised_world_studio_background']==True
          assert b['bone_count']==53 and not b['photoreal_human_approved']
          changes={}
          for name in ('front','three_quarter_25','profile_90'):
              fn='actual_blender_full_body_'+name+'.png'
              aa=Image.open(root/'original-body'/fn).convert('RGB')
              bb=Image.open(root/'new-independent-body'/fn).convert('RGB')
              A=np.asarray(aa,dtype=np.int16);B=np.asarray(bb,dtype=np.int16)
              assert A.shape==B.shape==(1260,840,3)
              pixels=int(np.count_nonzero(np.max(np.abs(A-B),axis=2)>16))
              assert pixels>2500,(name,pixels)
              changes[name]=pixels
              p=Image.new('RGB',(576,432))
              p.paste(aa.resize((288,432)),(0,0))
              p.paste(bb.resize((288,432)),(288,0))
              temp=io.BytesIO();p.save(temp,format='JPEG',quality=65)
              print('TRUE_NEW_BODY_AB_JPEG_'+name.upper()+'::'+base64.b64encode(temp.getvalue()).decode())
          report={'run_type':'real_new_body_topology','source_unchanged':True,
           'previous_head_preserved':True,'new_anatomical_mesh':n,
           'same_cameras_lights_world':True,'render_diffs':changes,
           'photoreal_approved':False,'production_deployed':False}
          (root/'new-body-one-shot-evidence.json').write_text(json.dumps(report,indent=2)+'\n')
          print('BLENDER_NEW_INDEPENDENT_TOPOLOGY_PROOF_PASS',json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independently-constructed-full-body-blender
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
