name: Blank Engine - Manual Experimental Afro Skin Binding Audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout experimental research code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/human-reference-atlas-20261018
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recover immutable existing human Blender scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source artifacts/afro-skinbound-hair
          gh run download 39130834258 --repo autonomousagentuniverse/blank-engine-lab --name coherent-afro-one-shot-blender-a-b --dir source
          printf '327befea50b2961d1ff3341fdf2e7b6bb173f7c74c09212c68061677a974b3f2  source/afro_woman_coherent_field_candidate.blend\n' | sha256sum -c -
      - name: Run dependency-free barycentric and skinweight regression
        run: |
          python3 -m unittest -v character-pipeline/references/test_skinbound_math.py
          python3 -m py_compile character-pipeline/references/build_skinbound_afro.py
      - name: Run actual Blender 4.5.3 deformed scalp-vs-hair measurement
        env:
          OMP_NUM_THREADS: '4'
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.3
          timeout -k 20s 1200s python3 -u character-pipeline/references/build_skinbound_afro.py
      - name: Enforce 3 of 3 pose gates without changing thresholds
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path('artifacts/afro-skinbound-hair')
          d=json.loads((p/'skinbound-report.json').read_text())
          assert d['source_sha256']=='327befea50b2961d1ff3341fdf2e7b6bb173f7c74c09212c68061677a974b3f2'
          assert d['source_unchanged'] and d['hair_count']==4450 and d['original_nurbs_retained']
          assert len(d['pose_tests'])==4
          assert d['tolerances']=={'p95_mm':2.0,'max_mm':5.0}
          assert d['skinbound_geometry_pass'] and all(v['pass'] for v in d['pose_tests'])
          assert not d['photorealism_approved'] and not d['rigged_export_glb_verified'] and not d['release_allowed']
          out=p/'afro_skinbound_hair_derivative.blend'
          assert out.stat().st_size>10000000
          assert hashlib.sha256(out.read_bytes()).hexdigest()==d['derivative_sha256']
          print('REAL_BLENDER_SCALP_DEFORMATION_AUDIT_PASS',[(v['pose'],v['gap']) for v in d['pose_tests']])
          PY
      - name: Retain report and editable Blender output even if quality gates fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blank-afro-skinbound-manual-evidence
          path: artifacts/afro-skinbound-hair/
          if-no-files-found: warn
          retention-days: 7
