name: Blank Engine - one-time Geometry Artifact UI verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-geometry-one-time.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned test libraries
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 playwright@1.56.1
      - name: Download pinned CC0 rigged reference for browser test
        run: |
          mkdir -p .ci-assets
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/kunalkushwaha/vsim/3f97faf85e46d2f9a122b0a8b8d3ccc0af598f91/packages/assets/library/suited.glb' -o .ci-assets/hero-original.glb
          node scripts/hero-eyes-build.mjs .ci-assets/hero-original.glb .ci-assets/hero-v22.glb
      - name: Test all geometry and regression contracts
        run: npm test
      - name: Test Character Lab geometry editor in Chrome
        run: node scripts/geometry-browser-smoke.mjs
      - name: Upload actual screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blank-geometry-artifact-chrome
          path: artifacts/geometry-artifact-character-lab.png
          if-no-files-found: ignore
          retention-days: 7

# Scoped rerun: serve Character Lab index explicitly in local Chrome test.

