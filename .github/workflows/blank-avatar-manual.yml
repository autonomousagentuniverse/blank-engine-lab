# Manual-only regression for the Alpha 0.6 rigged GLB/avatar integration.
# No deploy, no secrets, and no automatic push/pull-request triggers.
name: Blank Engine - manual rigged avatar and retarget tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install pinned real Three and Rapier libraries
        run: npm install --no-save --ignore-scripts --no-audit --no-fund three@0.186.1 @dimforge/rapier3d-compat@0.18.0
      - name: Regression suite
        run: npm test
      - name: Real Three.js GLB avatar and cross-rig motion transfer
        run: node scripts/avatar-real-smoke.mjs
      - name: Real Rapier physics and procedural skinning
        run: node scripts/physics-real-smoke.mjs
