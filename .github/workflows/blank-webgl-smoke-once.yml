# One-shot user-authorized browser QA. Must be removed after result.
name: Blank Engine - one-time real WebGL scene QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank-webgl-smoke-once.yml'
permissions:
  contents: read
jobs:
  webgl:
    if: github.event.head_commit.message == 'test-engine-webgl-smoke-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test runtime
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run unit tests
        run: npm test
      - name: Start static server and test actual 3D engine
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/blank-web-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.cjs
      - name: Upload WebGL screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blank-alpha05-webgl-smoke
          path: artifacts/blank-engine-alpha05-webgl.png
          if-no-files-found: ignore
          retention-days: 7
